name: Code Testing

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: yezz123/setup-uv@v4

      - name: Create virtual environment & install dependencies & activate virtual environment
        run: |
          uv sync --group dev --python ${{ matrix.python-version }}
          uv venv
          source .venv/bin/activate
          uv pip install -e .
        shell: bash

      - name: Test import (minimal dependencies)
        run: |
          source .venv/bin/activate
          python -c "import pystdf4; print(pystdf4.__version__)"
        shell: bash

      - name: Run pytest
        run: |
          source .venv/bin/activate
          pytest -v tests \
            --junitxml=test-results/junit-${{ matrix.python-version }}.xml \
            --junit-prefix=${{ matrix.python-version }}
        shell: bash

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: Test Results (Python ${{ matrix.python-version }})
          path: test-results/*.xml

      - name: Upload coverage to coveralls.io
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .venv/bin/activate
          coveralls --service=github

  publish-test-results:
    name: Publish Test Results
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish unit test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: "artifacts/**/*.xml"
